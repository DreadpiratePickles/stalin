[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalin-scraper"
version = "0.2.0"
description = "Turn any website into a self-healing, typed JSON API. Your scraper never breaks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DreadpiratePickles" }]
urls = { Homepage = "https://github.com/DreadpiratePickles/stalin", Repository = "https://github.com/DreadpiratePickles/stalin" }
keywords = ["scraping", "self-healing", "llm", "ollama", "api", "mcp"]
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
  "cssselect>=1.2",
  "beautifulsoup4>=4.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.scripts]
stalin = "stalin.cli:app"

[tool.setuptools.packages.find]
include = ["stalin*"]
